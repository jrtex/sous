[project]
name = "sous"
version = "0.1.0"
description = "LLM cooking assistant over a Cooklang recipe repository"
readme = "README.md"
authors = [
    { name = "jrtex" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "litellm>=1.110.1",
    "pint>=0.26.2",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/evals"]
addopts = "-m 'not eval'"
markers = ["eval: skill evals that call a real LLM (needs SOUS_MODEL)"]
